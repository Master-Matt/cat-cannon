system:
  arm_required: true
  cooldown_frames: 10
  fire_cooldown_seconds: 0.5
  fire_burst_count: 3
  fire_burst_interval_seconds: 0.5

vision:
  yolo_detector: yolo
  yolo_model: ""
  yolo_imgsz: 640
  yoloe_model: yoloe-11s-seg.pt
  yoloe_prompts:
    person: person
    cat: cat

detection:
  cat_class: cat
  person_class: person
  cat_confidence_threshold: 0.45
  person_confidence_threshold: 0.55
  consecutive_counter_frames: 3
  confirmation_miss_tolerance_frames: 5

human_lockout:
  window_seconds: 2
  frame_threshold: 5

tracking:
  horizontal_deadband_px: 25
  vertical_deadband_px: 25
  horizontal_gain: 0.03
  vertical_gain: 0.03
  aim_offset_x_px: 0
  aim_offset_y_px: 20
  servo_center_pan_deg: 0
  servo_center_tilt_deg: 0
  servo_min_pan_deg: 0
  servo_max_pan_deg: 180
  # Tilt is gravity-loaded, so the servo can lose drive torque near its travel
  # extremes (it still holds position but won't move under load until nudged).
  # Keep the commanded range inside the reliably drivable band; widen only if
  # your hardware (counterbalance / higher-torque servo / stiffer 5-6V supply)
  # can actually drive the full 30-150 mechanical range. Pan is unaffected.
  servo_min_tilt_deg: 45
  servo_max_tilt_deg: 135

tracking_tuning:
  ema_alpha: 0.35
  gain: 0.5
  pan_clamp_deg: 3.0
  tilt_clamp_deg: 3.0
  deadband_deg: 0.1
  frame_wait_ms: 10
  fire_requires_turret_target: true
  fire_aim_tolerance_px: 45
  fire_pan_tolerance_deg: 12

event_recording:
  enabled: false
  output_dir: data/event_videos
  post_shot_seconds: 15
  zone_confirm_seconds: 5
  zone_confirm_detections: 5
  zone_lost_seconds: 5
  max_event_seconds: 180
  video_fps: 10
  max_width: 640
  discord_max_upload_mb: 8
  publish_requires_shot: true
  discord_webhook_url: ''
  discord_webhook_env: CAT_CANNON_DISCORD_WEBHOOK_URL

heartbeat:
  enabled: false
  liveness_timeout_s: 15        # detection loop must tick within this window
  move_interval_s: 25           # send a deliberate idle "heartbeat move" this often
  move_pan_deg: 6               # heartbeat move size (clamped by servo limits on the Pico)
  move_tilt_deg: 3
  confirm_window_s: 2.5         # window to observe optical flow after a move
  flow_min_magnitude_px: 0.6    # minimum mean turret-camera flow to count as motion
  direction_dot_min: 0.15       # flow must broadly agree with commanded direction
  max_consecutive_motion_failures: 3
  pan_flow_sign: 1              # map commanded pan to expected camera flow x sign
  tilt_flow_sign: 1            # map commanded tilt to expected camera flow y sign
  scan_enabled: true           # slow pan back-and-forth scan while idle (vs. one-shot moves)
  scan_pan_speed_deg_s: 10     # how fast the idle scan sweeps
  scan_amplitude_deg: 25       # half-width of the scan band around pan center
  motion_grace_s: 30           # suppress motion-watchdog restarts this long after startup (warmup)
  discord_webhook_url: ''
  discord_webhook_env: CAT_CANNON_DISCORD_WEBHOOK_URL
  restart_reboot_threshold: 3   # this many app restarts within the window -> reboot
  restart_window_s: 600
  reboot_enabled: true
  reboot_command: sudo systemctl reboot
  state_path: ~/.cache/cat-cannon/restart-state.json
