system:
  arm_required: true
  cooldown_frames: 10
  fire_cooldown_seconds: 0.5
  fire_burst_count: 3
  fire_burst_interval_seconds: 0.5

vision:
  yolo_detector: yolo
  yolo_model: ""
  yolo_imgsz: 640
  yoloe_model: yoloe-11s-seg.pt
  yoloe_prompts:
    person: person
    cat: cat

detection:
  cat_class: cat
  person_class: person
  cat_confidence_threshold: 0.45
  person_confidence_threshold: 0.55
  consecutive_counter_frames: 3
  confirmation_miss_tolerance_frames: 5

human_lockout:
  window_seconds: 2
  frame_threshold: 5

tracking:
  horizontal_deadband_px: 25
  vertical_deadband_px: 25
  horizontal_gain: 0.03
  vertical_gain: 0.03
  aim_offset_x_px: 0
  aim_offset_y_px: 20
  servo_center_pan_deg: 0
  servo_center_tilt_deg: 0
  # A positional 360-degree pan servo uses 0 as center, allowing calibrated
  # left/right limits on both the positive and negative sides.
  servo_min_pan_deg: -180
  servo_max_pan_deg: 180
  # Tilt is gravity-loaded, so the servo can lose drive torque near its travel
  # extremes (it still holds position but won't move under load until nudged).
  # Keep the commanded range inside the reliably drivable band; widen only if
  # your hardware (counterbalance / higher-torque servo / stiffer 5-6V supply)
  # can actually drive the full 30-150 mechanical range. Pan is unaffected.
  servo_min_tilt_deg: 45
  servo_max_tilt_deg: 135

tracking_tuning:
  # Favor the newest bounding box so pan responds quickly; keep the lower tilt
  # clamp to avoid bringing back the harsh vertical jumps.
  ema_alpha: 0.6
  gain: 0.75
  pan_clamp_deg: 4.0
  tilt_clamp_deg: 2.5
  deadband_deg: 0.1
  frame_wait_ms: 10
  # Ignore one-off boxes: require five confidence-valid observations of the
  # same target class within one second before the servos begin tracking.
  acquisition_window_seconds: 1.0
  acquisition_frame_threshold: 5
  # Reject tiny false positives before they can physically steer the turret.
  min_turret_target_area_ratio: 0.005
  fire_requires_turret_target: true
  fire_aim_tolerance_px: 45
  fire_pan_tolerance_deg: 12
  # Center an unlocked target that keeps pushing into a hard servo limit.
  stuck_limit_seconds: 10
  # Do not keep steering toward a fixed-camera box after it has gone stale.
  fixed_lead_hold_seconds: 0.5

event_recording:
  enabled: false
  output_dir: data/event_videos
  post_shot_seconds: 15
  zone_confirm_seconds: 5
  zone_confirm_detections: 5
  zone_lost_seconds: 5
  max_event_seconds: 180
  video_fps: 10
  max_width: 640
  discord_max_upload_mb: 8
  publish_requires_shot: true
  discord_webhook_url: ''
  discord_webhook_env: CAT_CANNON_DISCORD_WEBHOOK_URL

heartbeat:
  enabled: false
  liveness_timeout_s: 15        # detection loop must tick within this window
  discord_webhook_url: ''
  discord_webhook_env: CAT_CANNON_DISCORD_WEBHOOK_URL
  restart_reboot_threshold: 3   # this many app restarts within the window -> reboot
  restart_window_s: 600
  reboot_enabled: true
  reboot_command: sudo systemctl reboot
  state_path: ~/.cache/cat-cannon/restart-state.json
