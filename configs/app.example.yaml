system:
  arm_required: true
  cooldown_frames: 10
  fire_cooldown_seconds: 0.5
  fire_burst_count: 3
  fire_burst_interval_seconds: 0.5

vision:
  yolo_detector: yolo
  yolo_model: ""
  yolo_imgsz: 640
  yoloe_model: yoloe-11s-seg.pt
  yoloe_prompts:
    person: person
    cat: cat

detection:
  cat_class: cat
  person_class: person
  cat_confidence_threshold: 0.45
  person_confidence_threshold: 0.55
  consecutive_counter_frames: 3
  confirmation_miss_tolerance_frames: 5

human_lockout:
  window_seconds: 2
  frame_threshold: 5

tracking:
  horizontal_deadband_px: 15
  vertical_deadband_px: 15
  horizontal_gain: 0.03
  vertical_gain: 0.03
  aim_offset_x_px: 0
  aim_offset_y_px: 20
  servo_center_pan_deg: 0
  servo_center_tilt_deg: 0
  servo_min_pan_deg: 0
  servo_max_pan_deg: 180
  servo_min_tilt_deg: 30
  servo_max_tilt_deg: 150

tracking_tuning:
  ema_alpha: 0.35
  gain: 0.5
  pan_clamp_deg: 3.0
  deadband_deg: 0.1
  frame_wait_ms: 10
  fire_requires_turret_target: true
  fire_aim_tolerance_px: 45
  fire_pan_tolerance_deg: 12

event_recording:
  enabled: false
  output_dir: data/event_videos
  post_shot_seconds: 15
  zone_confirm_seconds: 5
  zone_confirm_detections: 5
  zone_lost_seconds: 5
  max_event_seconds: 180
  video_fps: 10
  max_width: 640
  discord_max_upload_mb: 8
  discord_webhook_url: ''
  discord_webhook_env: CAT_CANNON_DISCORD_WEBHOOK_URL
